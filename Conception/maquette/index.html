<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bifurcation - Accueil</title>
    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>
<body>
    <header id="navbar">
        <div class="logo">Interview</div>
        <nav class="nav-links">
            <a href="index.html" class="active">Mode Lecture</a>
            <a href="mindmap.html">Mode Carte Mentale</a>
            <a href="profil.html">Profil</a>
        </nav>
    </header>

    <!-- Interview à la une : le contenu est rempli par home.js à partir de data.js -->
    <div class="hero" id="hero">
        <div class="hero-content">
            <h1 class="hero-title" id="hero-title"></h1>
            <div class="hero-meta" id="hero-meta"></div>
            <p class="hero-desc"><span id="hero-desc"></span> <strong>Lisez la vidéo jusqu'au bout, ou bifurquez selon vos envies.</strong></p>
            <div class="hero-buttons">
                <button class="btn btn-play" id="hero-play">▶ Lire la vidéo</button>
                <button class="btn btn-info">ℹ Plus d'infos</button>
            </div>
        </div>
    </div>

    <!-- Barre de filtres : les options sont générées à partir des tables genre_musical, lieu et artiste -->
    <div class="filters-bar">
        <label>🔍 Filtrer la base :</label>
        <select id="filter-genre" class="filter-select">
            <option value="">Toutes les Couleurs (Genres)</option>
        </select>
        <select id="filter-lieu" class="filter-select">
            <option value="">Tous les Lieux</option>
        </select>
        <select id="filter-artiste" class="filter-select">
            <option value="">Tous les Artistes</option>
        </select>
    </div>

    <!-- Rangées de vidéos : les cartes sont générées par home.js à partir de data.js -->
    <main class="content-section">
        <div class="theme-row">
            <div class="row-title">Extraits & Questions spécifiques</div>
            <div class="carousel" id="extraits-carousel"></div>
        </div>

        <div class="theme-row">
            <div class="row-title">Interviews Complètes</div>
            <div class="carousel" id="interviews-carousel"></div>
        </div>
    </main>

    <!-- Fenêtre modale d'une vidéo (interview ou extrait) -->
    <div id="video-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="modal-close">&times;</button>
            <div class="modal-header" id="modal-bg">
                <div class="modal-header-content">
                    <h2 id="modal-title">Titre de la vidéo</h2>
                    <div class="modal-actions">
                        <button class="btn btn-play" id="modal-play">▶ Lancer la vidéo</button>
                        <div class="player-choice">
                            <label for="player-source">Lecteur :</label>
                            <select id="player-source">
                                <option value="YOUTUBE">YouTube</option>
                                <option value="VIMEO">Vimeo</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-info">
                    <span id="modal-format-badge" class="format-badge">Format</span>
                    <span id="modal-location">📍 Lieu</span>
                </div>

                <div class="modal-layout">
                    <div class="modal-desc-box">
                        <p class="modal-desc" id="modal-desc"></p>
                        <div class="related-content">
                            <h3>Livre dont vous êtes le héros</h3>
                            <p class="subtitle">Choisissez votre prochain embranchement :</p>
                            <div class="related-links-container" id="modal-related-links"></div>
                        </div>
                    </div>

                    <!-- Fiche de la vidéo : les lignes sont générées par home.js -->
                    <div class="modal-meta-box" id="modal-meta"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/home.js"></script>
</body>
</html>
