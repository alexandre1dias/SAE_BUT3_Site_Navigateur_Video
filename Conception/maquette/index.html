<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bifurcation - Web TV</title>
    
    <!-- Police Roboto (Standard YouTube/Android) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>

    <!-- Nouveau conteneur flex pour gérer le menu à gauche et le reste à droite -->
    <header id="navbar">
        <div class="logo">Interview</div>
        <nav class="nav-links">
            <a href="index.html" class="active">Mode Lecture</a>
            <a href="mindmap.html">Mode Carte Mentale</a>
            <a href="profil.html">Profil</a>
        </nav>
    </header>

    <!-- Enveloppe pour le contenu principal -->
    <div class="main-wrapper">
        
        <!-- Barre de filtres collée en haut -->
        <div class="filters-bar">
            <label>Filtrer par :</label>
            <select id="filter-genre" class="filter-select">
                <option value="">Tous les Genres</option>
            </select>
            <select id="filter-lieu" class="filter-select">
                <option value="">Tous les Lieux</option>
            </select>
            <select id="filter-artiste" class="filter-select">
                <option value="">Tous les Artistes</option>
            </select>
        </div>

        <!-- Zone de défilement des vidéos -->
        <div class="scrollable-feed">
            
            <div class="hero" id="hero">
                <div class="hero-content">
                    <div class="hero-meta" id="hero-meta"></div>
                    <h1 class="hero-title" id="hero-title"></h1>
                    <p class="hero-desc"><span id="hero-desc"></span> Lisez la vidéo jusqu'au bout, ou bifurquez selon vos envies.</p>
                    <div class="hero-buttons">
                        <button class="btn btn-play" id="hero-play">▶ Lecture</button>
                        <button class="btn btn-info">ℹ Détails</button>
                    </div>
                </div>
            </div>

            <main class="content-section">
                <div class="theme-row">
                    <div class="row-title">Extraits & Questions spécifiques</div>
                    <div class="carousel" id="extraits-carousel"></div>
                </div>

                <div class="theme-row">
                    <div class="row-title">Interviews Complètes</div>
                    <div class="carousel" id="interviews-carousel"></div>
                </div>
            </main>

        </div> <!-- Fin scrollable-feed -->
    </div> <!-- Fin main-wrapper -->

    <!-- Fenêtre modale -->
    <div id="video-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="modal-close">&times;</button>
            
            <div class="modal-header" id="modal-bg">
                <div class="modal-header-content">
                    <h2 id="modal-title">Titre de la vidéo</h2>
                    <div class="modal-actions">
                        <button class="btn btn-play" id="modal-play">▶ Lancer la vidéo</button>
                        <div class="player-choice">
                            <select id="player-source" class="filter-select">
                                <option value="YOUTUBE">YouTube</option>
                                <option value="VIMEO">Vimeo</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-layout">
                    <div class="modal-desc-box">
                        <div class="modal-info">
                            <span id="modal-format-badge" class="format-badge">Format</span>
                            <span id="modal-location">Lieu</span>
                        </div>
                        <p class="modal-desc" id="modal-desc"></p>
                        
                        <div class="related-content">
                            <h3>Bifurcations disponibles :</h3>
                            <div class="related-links-container" id="modal-related-links"></div>
                        </div>
                    </div>
                    
                    <div class="modal-meta-box" id="modal-meta">
                        <!-- Rempli par le JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/home.js"></script>
</body>
</html>
