{% load videos %}
{# Une carte de vidéo. Les attributs data-* servent aux filtres (home.js) et à l'ouverture de la fiche (modal.js) #}
<div class="card"
     data-fiche="{{ type_fiche }}-{{ id_fiche }}"
     data-artiste="{{ interview.artiste.idArtiste }}"
     data-lieu="{{ interview.lieu.idLieu|default:'' }}"
     data-genres="{% for genre in interview.artiste.genres.all %}{{ genre.idGenre }}{% if not forloop.last %},{% endif %}{% endfor %}">
    <img src="{{ video|miniature_de }}" alt="Miniature">
    <div class="card-info">
        <span class="card-title">{{ titre }}</span>
        <span class="card-tags">
            {% for genre in interview.artiste.genres.all %}<span class="color-badge" style="--couleur-genre: {{ genre.codeCouleur }}"></span>{% endfor %}
            {{ type }} • {{ interview.lieu.villeLieu|default:"Lieu non précisé" }}
        </span>
    </div>
</div>
