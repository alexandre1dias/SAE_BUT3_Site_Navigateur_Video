{# Fenêtre modale : elle contient une fiche cachée par vidéo. modal.js affiche la bonne #}
<div id="video-modal" class="modal-overlay">
    <div class="modal-content">
        <button class="close-btn" id="modal-close">&times;</button>

        {% for interview in interviews %}
            {% include 'SoundFlow/partials/fiche_interview.html' %}
        {% endfor %}

        {% for extrait in extraits %}
            {% include 'SoundFlow/partials/fiche_extrait.html' %}
        {% endfor %}
    </div>
</div>
